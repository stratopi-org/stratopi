<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StratoPi Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ url_for('charts') }}"{% if request.endpoint == 'charts' %} aria-current="page"{% endif %}>Charts</a>
      <a href="{{ url_for('data') }}"{% if request.endpoint == 'data' %} aria-current="page"{% endif %}>Data</a>
    </nav>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
